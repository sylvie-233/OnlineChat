spring:
  application:
    name: onlinechat

  # ==================== 数据源 ====================
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/online_chat?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
    username: root
    password: 123456
    hikari:
      minimum-idle: 5
      maximum-pool-size: 20
      idle-timeout: 300000
      max-lifetime: 1200000
      connection-timeout: 30000

  # ==================== Redis ====================
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:redis123456}
      database: 0
      timeout: 5000ms
      lettuce:
        pool:
          max-active: 32
          max-idle: 16
          min-idle: 8
          max-wait: 3000ms
        shutdown-timeout: 200ms

  # ==================== 文件上传 ====================
  servlet:
    multipart:
      enabled: true
      max-file-size: 50MB
      max-request-size: 100MB

# ==================== MyBatis-Plus ====================
mybatis-plus:
  mapper-locations: classpath*:/mapper/**/*.xml
  global-config:
    db-config:
      id-type: auto
      logic-delete-field: isDeleted
      logic-delete-value: 1
      logic-not-delete-value: 0
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl

# ==================== Sa-Token ====================
sa-token:
  token-name: Authorization
  timeout: 2592000          # 30 天
  active-timeout: -1
  is-concurrent: true        # 允许并发登录
  is-share: true
  token-style: tik
  is-log: false

# ==================== Knife4j ====================
springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /v3/api-docs
knife4j:
  enable: true
  setting:
    language: zh_cn

# ==================== MinIO 对象存储 ====================
minio:
  endpoint: http://localhost:9000
  access-key: minioadmin
  secret-key: minio123456
  bucket: onlinechat

# ==================== IM 自定义配置 ====================
im:
  # Netty WebSocket 端口
  websocket:
    port: 9090
    path: /ws
  # 雪花算法 workerId（多实例部署时每个节点不同）
  snowflake:
    worker-id: 1
    datacenter-id: 1
  # 消息队列（高并发削峰，默认关闭，需配合 Redis Stream 使用）
  queue:
    enabled: false
  # 消息撤回窗口（分钟）
  message:
    recall-window-minutes: 2

# ==================== 日志 ====================
logging:
  file:
    path: ./logs
  level:
    com.sylvie233: debug
    io.netty: info
